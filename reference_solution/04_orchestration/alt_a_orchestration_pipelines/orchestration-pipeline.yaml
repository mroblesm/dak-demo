# ==============================================================================
# Step 4 (Alternative 4A): Declarative Orchestration Pipeline Definition (v1.0)
# Runtime-verified with `gcloud beta orchestration-pipelines deploy` and
# `orchestration_pipelines_lib` on Cloud Composer 3:
#   - Uses `modelVersion: '1.0'` and `runner: airflow`
#   - Chains:
#       1. `- pyspark:` (Dataproc Serverless Runtime 2.3 + Iceberg 1.5.0)
#       2. `- pipeline:` (dbt-bigquery project execution on Airflow worker)
#       3. `- sql:` (BigQuery ML counterfactual Rank-1 re-ranker scoring)
#   - Includes `tags: ["job:datacloud:vscode", "job:datacloud:antigravity"]`
# ==============================================================================

modelVersion: "1.0"
pipelineId: orchestration-pipeline
description: "End-to-end retail search intelligence pipeline: Managed Spark Bronze PII pseudonymisation -> dbt-bigquery Silver/Gold transformation -> Step 3 BQML re-ranker scoring"
owner: search-data-engineering
runner: airflow
tags:
  - "job:datacloud:antigravity"
  - "job:datacloud:vscode"
  - "retail-search-intelligence"
  - "data-agent-kit"

defaults:
  projectId: "{{ project_id }}"
  location: "{{ region }}"
  executionConfig:
    retries: 2

triggers:
  - schedule:
      interval: "0 4 * * *"
      startTime: "2026-09-01T00:00:00"
      endTime: "2027-09-01T00:00:00"
      catchup: false
      timezone: UTC

actions:
  - pyspark:
      name: stage_2_1_spark_bronze_pii_pseudonymisation
      mainFilePath: 02_preparation/alt_b_serverless_spark/spark_medallion_prep.py
      executionTimeout: 30m
      engine:
        dataprocServerless:
          resourceProfile:
            inline:
              environment_config:
                execution_config:
                  service_account: "s8s-spark-interactive@{{ project_id }}.iam.gserviceaccount.com"
                  subnetwork_uri: "projects/{{ project_id }}/regions/{{ region }}/subnetworks/dataproc-serverless-subnet"
              runtime_config:
                version: "2.3"
                properties:
                  spark.dynamicAllocation.enabled: "true"
                  spark.dynamicAllocation.initialExecutors: "2"
                  spark.dynamicAllocation.maxExecutors: "8"
                  spark.jars.packages: "org.apache.iceberg:iceberg-spark-runtime-3.5_2.13:1.5.0,org.apache.iceberg:iceberg-gcp-bundle:1.5.0,io.delta:delta-spark_2.13:3.2.0"
                  spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
                  spark.sql.catalog.lrc: "org.apache.iceberg.spark.SparkCatalog"
                  spark.sql.catalog.lrc.type: "rest"
                  spark.sql.catalog.lrc.uri: "https://biglake.googleapis.com/iceberg/v1/restcatalog"
                  spark.sql.catalog.lrc.warehouse: "gs://{{ project_id }}-iceberg-lakehouse"
                  spark.sql.catalog.lrc.header.x-goog-user-project: "{{ project_id }}"
                  spark.sql.catalog.lrc.header.X-Iceberg-Access-Delegation: "vended-credentials"
                  spark.sql.catalog.lrc.io-impl: "org.apache.iceberg.gcp.gcs.GCSFileIO"
                  spark.sql.catalog.biglakefederated: "org.apache.iceberg.spark.SparkCatalog"
                  spark.sql.catalog.biglakefederated.type: "rest"
                  spark.sql.catalog.biglakefederated.uri: "https://biglake.googleapis.com/iceberg/v1/restcatalog"
                  spark.sql.catalog.biglakefederated.warehouse: "bl://projects/{{ project_id }}/catalogs/biglakefederated"
                  spark.sql.catalog.biglakefederated.header.x-goog-user-project: "{{ project_id }}"
                  spark.sql.catalog.biglakefederated.header.X-Iceberg-Access-Delegation: "vended-credentials"
                  spark.sql.catalog.biglakefederated.io-impl: "org.apache.iceberg.gcp.gcs.GCSFileIO"

  - pipeline:
      name: stage_2_2_dbt_silver_gold_transformation
      dependsOn:
        - stage_2_1_spark_bronze_pii_pseudonymisation
      framework:
        dbt:
          airflowWorker:
            projectDirectoryPath: 02_preparation/alt_a_dbt_dea

  - sql:
      name: step_3_reranker_scoring
      dependsOn:
        - stage_2_2_dbt_silver_gold_transformation
      engine:
        bigquery:
          destinationTable: "{{ project_id }}.{{ serving_dataset }}.clarity_reranked_search_results"
          location: US
      query:
        inline: |
          SELECT
            search_event_id,
            item_id,
            query_tier,
            original_displayed_rank,
            ROUND((SELECT prob FROM UNNEST(predicted_purchased_probs) WHERE label = 1), 5) AS debiased_conversion_probability,
            ROW_NUMBER() OVER (
              PARTITION BY search_event_id
              ORDER BY (SELECT prob FROM UNNEST(predicted_purchased_probs) WHERE label = 1) DESC
            ) AS clarity_reranked_position
          FROM
            ML.PREDICT(
              MODEL `{{ project_id }}.{{ serving_dataset }}.bqml_conversion_reranker`,
              (
                SELECT
                  search_event_id,
                  item_id,
                  query_tier,
                  displayed_rank_position AS original_displayed_rank,
                  query_length_tokens,
                  1 AS displayed_rank_position,
                  lexical_bm25_score,
                  semantic_cosine_similarity,
                  historical_item_ctr,
                  price_usd,
                  average_rating,
                  customer_clv_segment,
                  SAFE.PARSE_TIMESTAMP('%Y-%m-%dT%H:%M:%E*S%Ez', CAST(event_timestamp AS STRING)) AS event_timestamp
                FROM `{{ project_id }}.{{ raw_dataset }}.search_impressions`
                WHERE event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
              )
            )
